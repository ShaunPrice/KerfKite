name: Build and compare the native core
# Runs for pull requests that change the core or its comparison, and on request.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - native/**
      - validation/native_core_parity.py
      - validation/native_core_recorder.py
      - .github/workflows/native-core.yml
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-2022, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the Python reference
        run: python -m pip install -e ".[dev]"
      - name: Use the Shapely release whose GEOS the core builds
        # The core compiles GEOS 3.14.1 (native/cmake/geos.cmake). Shapely 2.2.0 wheels contain that release;
        # with another GEOS the reference's polygons can differ from the core's.
        run: python -m pip install "shapely==2.2.0"
      - name: Identify the runner image
        id: image
        shell: bash
        run: echo "version=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Keep the GEOS download and build between runs
        # Only a time saving: without it GEOS is fetched and compiled again, with the same result.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native/_deps
          key: geos-${{ matrix.runner }}-${{ steps.image.outputs.version }}-${{ hashFiles('native/cmake/geos.cmake') }}
      - name: Build the native core
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel 4
      - name: Self-test without Python
        run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Compare with the Python reference
        shell: bash
        run: |
          cli=build/native/kerfkite-cam
          if [ -f build/native/Release/kerfkite-cam.exe ]; then cli=build/native/Release/kerfkite-cam.exe; fi
          python validation/native_core_parity.py --cli "$cli"
