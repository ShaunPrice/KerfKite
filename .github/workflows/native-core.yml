name: Build and compare the native core
# Runs for pull requests that change the core or its comparison, and on request.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - native/**
      - validation/native_core_parity.py
      - validation/native_core_recorder.py
      - validation/server_route_parity.py
      - validation/web_route_parity.py
      - validation/web_store_fixture.py
      - validation/pendant_tls_pin_check.py
      - validation/step_exchange_parity.py
      - packaging/pendant-tls/**
      - packaging/desktop/linux/**
      - studio/static/desktop-workspace.js
      - studio/cad_exchange.py
      # The workstation server and the hosted editor are compared route by route with the Flask apps.
      - studio/server.py
      - studio/design_api.py
      - studio/web_server.py
      - studio/web_store.py
      - studio/web_transfer.py
      # The reference computes offsets, pockets, fills and V-carves, and places helical pocket entries,
      # through the extension, which is built from these.
      - studio/operations.py
      - studio/router_entry.py
      - studio/_core_native.cpp
      - setup.py
      - .github/workflows/native-core.yml
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-2022, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        # The phone pendant's TLS relay is built and tested with Go's standard library only.
        with:
          go-version: "1.24.7"
          cache: false
      - name: Install the Python reference with its compiled extension
        # Offsets, pockets, fills and V-carves are compared through the extension, so it must have been built.
        # The step extra (OCP) is the reference for STEP exchange.
        run: python -m pip install -e ".[dev,step]"
        env:
          KERFKITE_REQUIRE_NATIVE: "1"
      - name: Install Open CASCADE for the STEP add-on
        # Ubuntu's own build (7.6); the releases use 7.9.3, the reference's.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libocct-data-exchange-dev libocct-modeling-algorithms-dev libtbb-dev
      - name: Build the native core
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel 4
      - name: Self-test without Python
        run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Test the phone pendant's TLS relay
        shell: bash
        run: cd packaging/pendant-tls && GO111MODULE=off CGO_ENABLED=0 go test -count=1 .
      - name: Compare with the Python reference
        shell: bash
        run: |
          cli=build/native/kerfkite-cam
          if [ -f build/native/Release/kerfkite-cam.exe ]; then cli=build/native/Release/kerfkite-cam.exe; fi
          python validation/native_core_parity.py --cli "$cli"
      - name: Compare the workstation server with the Flask reference
        shell: bash
        run: |
          server=build/native/kerfkite-studio
          if [ -f build/native/Release/kerfkite-studio.exe ]; then server=build/native/Release/kerfkite-studio.exe; fi
          python validation/server_route_parity.py --server "$server" --mutations 12
      - name: Compare the hosted editor with the Flask reference
        shell: bash
        run: |
          web=build/native/kerfkite-web
          if [ -f build/native/Release/kerfkite-web.exe ]; then web=build/native/Release/kerfkite-web.exe; fi
          python validation/web_route_parity.py --server "$web" --cases 400
          python validation/web_route_parity.py --server "$web" --cases 100 --seed 2 --tls
      - name: Check Pocket's certificate pinning against the workstation server
        if: runner.os == 'Linux'
        run: python validation/pendant_tls_pin_check.py --server build/native/kerfkite-studio
      - name: Compare STEP exchange with the reference's Open CASCADE
        if: runner.os == 'Linux'
        run: python validation/step_exchange_parity.py --server build/native/kerfkite-studio --parts 40 --surfaces 40
      - name: Exercise the Linux desktop window against the workstation server
        # The GTK window in C with Ubuntu's WebKitGTK 4.1, driven as a person would under a virtual display.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-0 xvfb xauth dbus-x11
          cmake -S packaging/desktop/linux -B build/window -DCMAKE_BUILD_TYPE=Release
          cmake --build build/window --parallel 4
          build/window/kerfkite-native --check
          build/native/kerfkite-studio --port 18765 --static studio/static > studio.log 2>&1 &
          server=$!
          for i in $(seq 100); do grep -q KERFKITE_READY studio.log && break; sleep 0.1; done
          dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" build/window/kerfkite-native-smoke http://127.0.0.1:18765/
          kill $server
