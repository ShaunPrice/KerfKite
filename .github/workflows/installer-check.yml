name: Check desktop release installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v0.6.1
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, file: KerfKite-Windows-x64-Setup.exe}
          - {os: macos-15, file: KerfKite-macOS-Apple-Silicon.dmg}
          - {os: macos-15-intel, file: KerfKite-macOS-Intel.dmg}
          - {os: ubuntu-24.04, file: KerfKite-Linux-amd64.deb}
          - {os: ubuntu-24.04-arm, file: KerfKite-Linux-arm64.deb}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      INSTALLER: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Fetch release package and verify its checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --pattern "$INSTALLER" --pattern SHA256SUMS.txt
          python -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["INSTALLER"]); assert hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name in pathlib.Path("SHA256SUMS.txt").read_text().splitlines()'
      - name: Verify Windows Server rejection
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((Get-CimInstance Win32_OperatingSystem).ProductType -eq 1) { throw "This rejection check requires a Server runner." }
          $setup = Start-Process ".\$env:INSTALLER" -ArgumentList "/S" -Wait -PassThru
          if ($setup.ExitCode -ne 1150) { throw "Expected unsupported Windows exit 1150, got $($setup.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA "Programs\KerfKite Studio"
          if (Test-Path $installed) { throw "Setup unexpectedly created an installation directory" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\KerfKiteStudio"
          if (Test-Path $key) { throw "Setup unexpectedly registered an installation" }
          $extract = Join-Path $env:RUNNER_TEMP "kerfkite-platform-test"
          7z x -y "-o$extract" ".\$env:INSTALLER" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract the packaged executables" }
          foreach ($name in "KerfKite.exe", "KerfKiteNative.exe") {
            $check = Start-Process (Join-Path $extract $name) -ArgumentList "--check-windows" -PassThru -Wait
            if ($check.ExitCode -ne 1150) { throw "$name returned $($check.ExitCode) on Server" }
          }
      - name: Install and exercise macOS disk image
        if: runner.os == 'macOS'
        run: |
          hdiutil attach "$INSTALLER" -mountpoint "$RUNNER_TEMP/kerfkite-dmg" -nobrowse
          ditto "$RUNNER_TEMP/kerfkite-dmg/KerfKite Studio.app" "$RUNNER_TEMP/KerfKite Studio.app"
          hdiutil detach "$RUNNER_TEMP/kerfkite-dmg"
          codesign --verify --strict "$RUNNER_TEMP/KerfKite Studio.app"
          python3 validation/installer_smoke.py "$RUNNER_TEMP/KerfKite Studio.app/Contents/MacOS/KerfKite" --step --native
      - name: Install and exercise Debian package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y "./$INSTALLER" xvfb xauth dbus-x11
          dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" python3 validation/installer_smoke.py /opt/kerfkite/KerfKite --step --native
          sudo apt-get remove -y kerfkite-studio
