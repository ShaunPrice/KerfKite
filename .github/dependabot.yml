# Dependabot version updates do not consume GitHub Actions minutes.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: monthly}
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: gradle
    directory: /android
    schedule: {interval: monthly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
