plugins { id 'com.android.application' version '8.13.2' }
android {
    namespace 'au.cncstudio.pocket'
    compileSdk 35
    // The guide asks for Build Tools 35. Without this the plugin fetches its own default and stops at the SDK licence prompt.
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'au.cncstudio.pocket'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.5.0'
    }
    buildTypes {
        // Both builds drop the code they never reach, which is most of the QR library: only its QR reader is used.
        // The debug build is shrunk the same way, so what is tried on a phone is what a release contains.
        configureEach {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // A debug build installs beside the release app under its own id and name, so testing one never
        // replaces the other or its saved projects.
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            resValue 'string', 'app_label', 'Pocket debug'
        }
        release {
            resValue 'string', 'app_label', 'KerfKite Pocket'
        }
    }
}
dependencies {
    // QR decoding for the pairing-code scanner. Apache-2.0; its licence and notice are in src/main/assets.
    implementation 'com.google.zxing:core:3.5.3'
}
