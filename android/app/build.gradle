plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'au.cncstudio.pocket'
    compileSdk 35
    // The guide asks for Build Tools 35. Without this the plugin fetches its own default and stops at the SDK licence prompt.
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'au.cncstudio.pocket'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.5.0'
    }
    buildTypes {
        // A debug build installs beside the release app under its own id and name, so testing one never
        // replaces the other or its saved projects.
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            resValue 'string', 'app_label', 'Pocket debug'
        }
        release {
            resValue 'string', 'app_label', 'KerfKite Pocket'
        }
    }
}
