<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KerfKite stock artwork</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#193b3c;font:16px/1.5 system-ui,sans-serif}
main{max-width:90rem;margin:auto;padding:clamp(1rem,4vw,4rem)}h1{font:clamp(2.5rem,6vw,5rem)/1.05 Georgia,serif;margin:.25em 0}
.tools,nav{display:flex;flex-wrap:wrap;gap:1rem;align-items:end}label{display:grid;gap:.25rem}button,input,select{font:inherit;padding:.45rem .7rem}
nav{align-items:center;margin:1rem 0}#tiles{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(13rem,100%),1fr))}
article{background:#fff;border:1px solid #d3d8d0;padding:1rem}article img{width:100%;height:9rem;object-fit:contain;padding:.6rem}
article a{color:inherit;text-decoration:none;display:grid;gap:.35rem}a:hover strong{text-decoration:underline}small{color:#4c635a}
</style></head><body><main><h1>KerfKite stock artwork</h1>
<p>Select a drawing to open its SVG in a new tab. To use the file in Studio, choose <b>Images → Import SVG</b> and select it from the matching artwork folder. Set the design dimensions shown below the preview. The files contain editable paths for cutting and engraving.</p>
<div class="tools"><label>Category<select id="category"><option value="">All categories</option></select></label><label>Search artwork<input type="search" id="query"></label></div>
<nav aria-label="Gallery pages"><button id="back">Previous</button><span id="count" aria-live="polite"></span><button id="next">Next</button></nav>
<div id="tiles"></div><p><a href="LICENSE.txt">MIT licence</a></p></main>
<script id="artwork" type="application/json">ARTWORK_DATA</script><script>
const rows=JSON.parse(document.getElementById('artwork').textContent);
const byId=id=>document.getElementById(id);
const category=byId('category'), query=byId('query'), tiles=byId('tiles'), size=36;
for(const name of [...new Set(rows.map(row=>row[1]))].sort()) category.add(new Option(name,name));
let page=0;
function render(){
  const words=query.value.toLowerCase().trim().split(/\s+/);
  const filtered=rows.filter(([name,group])=>(!category.value || group===category.value) && words.every(w=>(name+' '+group).toLowerCase().includes(w)));
  const total=Math.max(1,Math.ceil(filtered.length/size));
  byId('count').textContent=filtered.length+' designs · Page '+(page+1)+' of '+total;
  byId('back').disabled=page===0; byId('next').disabled=page>=total-1;
  tiles.replaceChildren();
  for(const [name,group,dimensions,file] of filtered.slice(page*size,(page+1)*size)){
    const card=document.createElement('article'),link=document.createElement('a'),image=document.createElement('img');
    link.href=file;link.target='_blank';link.rel='noopener';image.src=file;image.alt='';image.loading='lazy';
    const title=document.createElement('strong'),details=document.createElement('small');title.textContent=name;details.textContent=group+' · '+dimensions;
    link.append(image,title,details);card.append(link);tiles.append(card);
  }
}
query.oninput=category.onchange=()=>{page=0;render()};
byId('back').onclick=()=>{page--;render()};byId('next').onclick=()=>{page++;render()};render();
</script></body></html>
