[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kerfkite-studio"
dynamic = ["version"]
description = "Cross-platform CNC, laser and knife design workspace"
requires-python = ">=3.10"
license = "MIT AND OFL-1.1 AND Zlib"
license-files = ["LICENSE", "studio/static/vendor/*LICENSE.txt", "studio/static/vendor/*OFL.txt"]
dependencies = ["Flask>=3.1,<4", "pyserial>=3.5,<4", "shapely>=2.1,<3", "Pillow>=11,<13", "numpy>=2,<3", "manifold3d>=3.5,<4", "ezdxf>=1.4,<2", "pypdf>=7.1.1,<8"]

[project.optional-dependencies]
step = ["cadquery-ocp-novtk>=7.9.3,<8"]
web = ["cheroot>=10,<12", "cryptography>=46,<51"]
mcp = ["fastmcp>=3.4.11,<5", "pydantic>=2.12,<3", "playwright>=1.51,<2"]
dev = ["ruff>=0.8", "pytest>=8", "pytest-cov>=5"]

[project.scripts]
cnc-studio = "studio.server:main"
cnc-studio-web = "studio.web_server:main"
cnc-studio-mcp = "studio.mcp_server:main"

[tool.setuptools.dynamic]
version = {attr = "studio.__version__"}

[tool.setuptools.package-data]
studio = ["static/*", "static/icons/*", "static/vendor/*", "builtin_templates.kkart"]

[tool.ruff]
target-version = "py310"
# Formatting is not enforced yet: the dense house style is reformatted in a separate, mechanical change.
line-length = 320

[tool.ruff.lint]
# Syntax errors, pyflakes, likely bugs and security rules. Style rules are deliberately off.
select = ["E9", "F", "B", "S"]
ignore = [
    "B905",  # zip() without strict=: 42 call sites not yet reviewed individually
    "B023",  # reviewed 2026-11-21: every flagged closure is called inside the iteration that defines it
    "S110",  # reviewed 2026-11-21: best-effort emergency-stop writes while closing a faulted serial port
]

[tool.ruff.lint.per-file-ignores]
"studio/phone_monitor_service.py" = ["S104"]  # the pendant listener is a LAN service by design
"studio/web_server.py" = ["S104"]             # hosted HTTPS editor; the bind address is an operator option
"studio/web_transfer.py" = ["S310"]           # destination is validated as HTTPS by validate_destination
"studio/windows_support.py" = ["S603"]        # fixed argument list, no shell
