# KerfKite's programs are C++ (native/), Go (packaging/) and the browser editor (studio/static). Python remains
# only in the development tools: the validation harnesses, the build and help scripts and their tests, which use
# the standard library unless a harness says otherwise. This file holds their lint settings.

[tool.ruff]
target-version = "py310"
line-length = 120
# Python sources only: fenced code in the guides is left as written.
extend-exclude = ["*.md"]

[tool.ruff.format]
# Keep the project's single-quoted strings; only layout is normalised.
quote-style = "preserve"

[tool.ruff.lint]
# Syntax errors, pyflakes, likely bugs and security rules. Style rules are deliberately off.
select = ["E9", "F", "B", "S"]
ignore = [
    "B905",  # zip() without strict=: call sites not yet reviewed individually
    "B023",  # reviewed 2026-11-21: every flagged closure is called inside the iteration that defines it
]

[tool.ruff.lint.per-file-ignores]
# The checks and their tests assert what they find (S101), start the programs under test, adb and the browser
# with fixed argument lists (S603, S607), talk to those programs on the loopback interface (S310), parse what
# the device under test dumps (S314), draw fixtures from seeded generators (S311) and hold test tokens (S105).
"validation/**" = ["S101", "S105", "S310", "S311", "S314", "S603", "S607"]
"tests/**" = ["S101", "S311", "S603", "S607"]
"scripts/**" = ["S101", "S603", "S607"]
"packaging/**" = ["S603", "S607"]
